<!doctype html>
<!-- 5-minute speaker timer. Scales to fill whatever window or iframe it sits in. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker timer</title>
<style>
  html, body { margin: 0; height: 100%; }
  .p1t { box-sizing: border-box; height: 100vh; width: 100vw; padding: 3vmin;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7;
         text-align: center; transition: background .3s; overflow: hidden; }
  .p1t-label { font-size: clamp(11px, 5vmin, 32px); color: #5e6c84; }
  .p1t-time { font-size: min(30vw, 48vh); line-height: 1; font-weight: 700;
              font-variant-numeric: tabular-nums; color: #172b4d; }
  .p1t-btns { display: flex; gap: 2vmin; }
  .p1t button { font-size: clamp(12px, 5vmin, 30px); padding: .45em .9em; border: 0; border-radius: .35em;
                cursor: pointer; background: #0052cc; color: #fff; }
  .p1t button.p1t-sec { background: #dfe1e6; color: #172b4d; }
  .p1t.p1t-warn { background: #fff4d6; }
  .p1t.p1t-flash { background: #ffebe6; }
  .p1t.p1t-flash .p1t-time { color: #de350b; animation: p1t-blink 1s steps(1, end) infinite; }
  .p1t.p1t-done { background: #ffd5d2; }
  .p1t.p1t-done .p1t-time { color: #bf2600; }
  @keyframes p1t-blink { 50% { opacity: .15; } }
</style>

<div class="p1t" id="p1t">
  <div class="p1t-label">Speaking time</div>
  <div class="p1t-time" id="p1t-time">5:00</div>
  <div class="p1t-btns">
    <button id="p1t-start">Start</button>
    <button id="p1t-reset" class="p1t-sec">Next speaker</button>
  </div>
</div>

<script>
(function () {
  var TOTAL = 5 * 60, WARN = 60, FLASH = 30;   // seconds; change TOTAL for a different length
  var box = document.getElementById('p1t'),
      out = document.getElementById('p1t-time'),
      startBtn = document.getElementById('p1t-start'),
      resetBtn = document.getElementById('p1t-reset');
  var left = TOTAL, timer = null, endAt = 0;

  function render() {
    var s = Math.max(0, Math.ceil(left));
    out.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    box.classList.toggle('p1t-warn', s <= WARN && s > FLASH);
    box.classList.toggle('p1t-flash', s <= FLASH && s > 0);
    box.classList.toggle('p1t-done', s === 0);
  }
  function tick() {
    left = (endAt - Date.now()) / 1000;
    if (left <= 0) { left = 0; stop(); beep(); }
    render();
  }
  function stop() { clearInterval(timer); timer = null; startBtn.textContent = left > 0 ? 'Resume' : 'Start'; }
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator();
      o.connect(ctx.destination); o.frequency.value = 880; o.start(); o.stop(ctx.currentTime + 0.4);
    } catch (e) {}
  }

  startBtn.onclick = function () {
    if (timer) { stop(); return; }
    if (left <= 0) left = TOTAL;
    endAt = Date.now() + left * 1000;
    timer = setInterval(tick, 200);
    startBtn.textContent = 'Pause';
  };
  resetBtn.onclick = function () { stop(); left = TOTAL; startBtn.textContent = 'Start'; render(); };
  render();
})();
</script>
